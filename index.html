  <script>
    // ── DATA ─────────────────────────────────────────────────────────────────────
    // 行程資料在 data/day1.json ~ data/day4.json
    // 待辦資料在 data/checklist.json
    // 行程標題/日期/天氣城市設定在 data/config.json
    let DAYS = [];
    let GTASKS = {};
    let SHOP_DEF = [];
    let CONFIG = {};
    let CITIES = {};
    let ACCESS = {};  // data/access.json：行程 id → 「怎麼去」的句子（手動挑出來，和備註分開顯示）
    let CITYROUTE = {}; // data/day-cities.json：第幾天 → 當天經過的城市（依順序，手動維護）
    let THEMES = {};  // data/day-themes.json：第幾天 → 今日一句話（手動維護）
    let SHORT = {};   // data/short-titles.json：行程 id → 一句話短標題（手動維護）
    let FLIGHTS = {}; // data/flights.json：以航班編號為 key 的行李、餐點等資訊
    const SHOP_KEY = 'jp-shop';
    const SW_CACHE_NAME = 'kansai-walks-v4'; // 要跟 sw.js 裡的 CACHE_NAME 保持一致

    async function loadData() {
      // 天數放在 config.json 的 days，不寫死在程式裡；先抓 config 才知道要抓幾天
      const configRes = await fetch('data/config.json');
      const dayCount = (await configRes.clone().json()).days;
      const dayFiles = Array.from({ length: dayCount }, (_, i) => `data/day${i + 1}.json`);
      // 選配檔（缺了不影響行程）：每天一句話主題、短標題、航班資訊
      const OPTIONAL = ['data/day-cities.json', 'data/day-themes.json', 'data/short-titles.json', 'data/flights.json', 'data/access.json'];
      const dataFiles = [...dayFiles, ...OPTIONAL, 'data/checklist.json', 'data/config.json'];
      const responses = await Promise.all(dataFiles.map(f => f === 'data/config.json' ? configRes
        : OPTIONAL.includes(f) ? fetch(f).then(r => r.ok ? r : new Response('{}')) // 選配檔缺了不要讓整個 App 打不開
        : fetch(f)));
      // clone 要在讀取 body 之前、同步做完，不然會跟下面的 r.json() 搶讀同一個 body 而出錯
      const cacheClones = responses.map(res => res.clone());
      // 直接把行程資料寫進 Service Worker 的快取，離線時才拿得到；
      // 快取名稱要跟 sw.js 裡的 CACHE_NAME 保持一致
      if ('caches' in window) {
        caches.open(SW_CACHE_NAME).then(cache => cacheClones.forEach((res, i) => cache.put(dataFiles[i], res)));
      }
      const jsons = await Promise.all(responses.map(r => r.json()));
      const byFile = Object.fromEntries(dataFiles.map((f, i) => [f, jsons[i]])); // 用檔名取，不靠位置
      const days = dayFiles.map(f => byFile[f]);
      CITYROUTE = byFile['data/day-cities.json'];
      THEMES = byFile['data/day-themes.json'];
      ACCESS = byFile['data/access.json'];
      SHORT = byFile['data/short-titles.json'];
      FLIGHTS = byFile['data/flights.json'];
      const checklist = byFile['data/checklist.json'];
      const config = byFile['data/config.json'];
      DAYS = days;
      GTASKS = checklist.GTASKS;
      SHOP_DEF = checklist.SHOP_DEF;
      CONFIG = config;
      CITIES = config.cities;
      document.title = CONFIG.title;
      document.getElementById('tbt').textContent = CONFIG.title;
      const appTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (appTitleMeta) appTitleMeta.setAttribute('content', CONFIG.shortTitle);
      document.getElementById('wcity-tabs').innerHTML = Object.keys(CITIES)
        .map((c, i) => `<div class="wct${i === 0 ? ' active' : ''}" onclick="selCity('${c}')">${CITIES[c].label}</div>`)
        .join('');
      // 只換算 config.json 設定的幣別（日幣 → 台幣），不再提供其他幣別
      document.getElementById('fx-hdr').textContent = `匯率換算 ${CONFIG.currency.from} ↔ ${CONFIG.currency.to}`;
      document.getElementById('fx-lb-from').textContent = fxLabel(CONFIG.currency.from);
      document.getElementById('fx-lb-to').textContent = fxLabel(CONFIG.currency.to);
      liveRate = CONFIG.currency.referenceRate || null;
    }

    // ── STATE ─────────────────────────────────────────────────────────────────────
    let curPage = 'home', curDay = null;
    const expanded = new Set();

    function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { } }
    function load(k, d) { try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : d } catch (e) { return d } }
    function getTasks() { return load('jp-tasks', {}) }
    function setTask(id, v) { const t = getTasks(); t[id] = v; store('jp-tasks', t) }
    function getShop() { return load(SHOP_KEY, SHOP_DEF.map(i => ({ ...i, done: false }))) }
    function saveShop(l) { store(SHOP_KEY, l) }

    // ── CLOCK ─────────────────────────────────────────────────────────────────────
    function jst() {
      // 回傳一個「本地欄位 = 日本當地時間」的 Date，其他程式用 getHours() 等就是日本時間。
      // 用 Intl 直接取各欄位，比 toLocaleString 再 parse 穩定（Safari 也一致）
      const p = {};
      new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Tokyo', hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' })
        .formatToParts(new Date()).forEach(x => { p[x.type] = +x.value; });
      return new Date(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    }
    function tripDay() { const n = jst(), s = new Date(CONFIG.tripStartDate + 'T00:00:00'), d = Math.floor((n - s) / 86400000); return (d >= 0 && d < DAYS.length) ? d + 1 : null }
    // 起飛時間：台灣 2026/11/29 09:00。用帶時區偏移的 ISO 字串，得到的是絕對時間點，
    // 不管手機在哪個時區算出來都一樣（不要用 new Date(y, m, d) 這種吃本地時區的寫法）
    const DEPART_AT = new Date('2026-11-29T09:00:00+08:00');
    function renderCountdown() {
      const el = document.getElementById('countdown'); if (!el) return;
      const ms = DEPART_AT - Date.now();
      if (ms <= 0) { el.hidden = true; return; }
      const d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
      el.hidden = false;
      el.innerHTML = `<div class="cd-label">距離起飛（台灣 11/29 09:00）</div><div class="cd-num"><b>${d}</b><span>天</span><b>${String(h).padStart(2, '0')}</b><span>時</span><b>${String(m).padStart(2, '0')}</b><span>分</span></div>`;
    }
    function tick() {
      const n = jst(), hh = String(n.getHours()).padStart(2, '0'), mm = String(n.getMinutes()).padStart(2, '0');
      const ce = document.getElementById('h-clk'); if (ce) ce.textContent = '日本 ' + hh + ':' + mm;
      if (curPage === 'home') renderCountdown();
      if (curPage === 'home') renderNow(); // 「現在／下一站」隨時間更新
    }

    // ── NAV ───────────────────────────────────────────────────────────────────────
    // 頁面：home（首頁）／trip（行程列表）／day（某一天）／chk（清單）／tools（資訊）／sos（緊急）
    const PAGE_EL = { home: 'pg-home', trip: 'pg-trip', day: 'pg-day', chk: 'pg-chk', tools: 'pg-tools', sos: 'pg-sos' };
    const NAV_EL = { home: 'ni-home', trip: 'ni-trip', day: 'ni-trip', chk: 'ni-chk', tools: 'ni-tools', sos: 'ni-sos' };
    function goPg(name) {
      curPage = name;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.ni').forEach(n => { n.classList.remove('active'); n.removeAttribute('aria-current'); });
      document.getElementById('scroll').scrollTop = 0;
      document.getElementById(PAGE_EL[name]).classList.add('active');
      const cur = document.getElementById(NAV_EL[name]); cur.classList.add('active'); cur.setAttribute('aria-current', 'page');
      const tl = document.getElementById('tbl'), tt = document.getElementById('tbt');
      if (name === 'home') { tl.innerHTML = ''; tt.textContent = CONFIG.title; tick(); renderHome(); }
      else if (name === 'trip') { tl.innerHTML = ''; tt.textContent = '行程'; renderTrip(); }
      else if (name === 'sos') { tl.innerHTML = ''; tt.textContent = '緊急'; renderSos(); }
      else if (name === 'day') { const d = DAYS[curDay - 1]; tl.innerHTML = '<button class="tb-back" type="button" onclick="goPg(\'trip\')">‹ 返回</button>'; tt.textContent = '行程'; renderDay(); }
      else if (name === 'chk') { tl.innerHTML = ''; tt.textContent = '清單'; renderChk(); }
      else if (name === 'tools') { tl.innerHTML = ''; tt.textContent = '資訊'; renderQFx(); fetchRate(); loadWx(Object.keys(CITIES)[0]); }
      applyDisplay();
    }
    function openDay(n) { curDay = n; expanded.clear(); goPg('day'); } // 每次打開某一天都是全部收合

    // ── 字級（只在「資訊」頁調整）──────────────────────────────────────────────────
    // 狀態放在 <html data-fs>，CSS 用百分比縮放根字體，所有 rem 尺寸會一起放大
    const FS_KEY = 'kw-fs', FS_MAX = 3;
    const FS_LABEL = ['標準', '大', '特大', '超大'];
    function getFs() { const n = load(FS_KEY, 0); return Number.isInteger(n) && n >= 0 && n <= FS_MAX ? n : 0; }
    function fsCtrlHtml() {
      return `<div class="fs-ctrl"><button type="button" class="fs-btn" aria-label="字變小" onclick="setFs(-1)">A－</button><span class="fs-val" aria-live="polite"></span><button type="button" class="fs-btn" aria-label="字變大" onclick="setFs(1)">A＋</button></div>`;
    }
    function applyDisplay() {
      const f = getFs();
      document.documentElement.dataset.fs = f;
      document.querySelectorAll('.fs-slot').forEach(e => { if (!e.firstChild) e.innerHTML = fsCtrlHtml(); });
      document.querySelectorAll('.fs-val').forEach(e => { e.textContent = FS_LABEL[f]; });
      document.querySelectorAll('.fs-btn').forEach((e, i) => { e.disabled = (i % 2 === 0) ? f === 0 : f === FS_MAX; });
    }
    function setFs(delta) { store(FS_KEY, Math.min(FS_MAX, Math.max(0, getFs() + delta))); applyDisplay(); }

    // ── NOW / NEXT（現在、下一站）─────────────────────────────────────────────────
    // "08:00–08:15" → {s: 480, e: 495}；只有 "20:25" 時 e 為 null
    function parseTimes(t) {
      const ms = (t || '').match(/\d{1,2}:\d{2}/g) || [];
      const toMin = x => { const [h, m] = x.split(':'); return +h * 60 + +m; };
      return { s: ms[0] != null ? toMin(ms[0]) : null, e: ms[1] != null ? toMin(ms[1]) : null };
    }
    function nowNextState() {
      const td = tripDay();
      if (!td) return { kind: 'none' }; // 旅行前／後不顯示，首頁已有倒數與結束訊息
      const d = DAYS[td - 1], n = jst(), mins = n.getHours() * 60 + n.getMinutes();
      const slots = d.items.map(it => ({ it, ...parseTimes(it.time) })).filter(x => x.s != null);
      // 只有開始時間的項目：到下一項開始前都算「現在」，最後一項到午夜
      slots.forEach((x, i) => { if (x.e == null) x.e = slots[i + 1] ? slots[i + 1].s : 24 * 60; });
      const cur = slots.find(x => x.s <= mins && mins < x.e), nxt = slots.find(x => x.s > mins);
      if (!cur && !nxt) return { kind: 'done', day: d };
      return { kind: 'live', day: d, cur: cur && cur.it, next: nxt && nxt.it };
    }
    function ncCard(label, it, day, cls) {
      const meta = [it.time, it.area].filter(Boolean).map(X).join(' ・ ');
      return `<div class="nc ${cls}"><div class="nc-lb">${label}</div><div class="nc-t">${X(it.title)}</div><div class="nc-m">${meta}</div>${goBtn(it, day, 'big')}</div>`;
    }
    function ncMsg(label, text, cls) { return `<div class="nc ${cls || ''}"><div class="nc-lb">${label}</div><div class="nc-t">${text}</div></div>`; }
    function nowHtml() {
      const st = nowNextState();
      if (st.kind === 'none') return '';
      if (st.kind === 'done') return ncMsg('今天的行程結束了', '好好休息', 'nc-msg');
      return (st.cur ? ncCard('現在', st.cur, st.day, 'nc-now') : ncMsg('現在', '空檔，休息一下', 'nc-msg'))
        + (st.next ? ncCard('下一站', st.next, st.day, 'nc-next') : ncMsg('下一站', '今天沒有下一站了', 'nc-msg'));
    }
    function renderNow() {
      const el = document.getElementById('now-wrap'); if (!el) return;
      const html = curPage === 'home' ? nowHtml() : '';
      if (el.dataset.html === html) return; // 沒變就不重畫，避免每 15 秒閃一下或打斷點擊
      el.dataset.html = html; el.innerHTML = html;
    }

    // ── 航班資訊（從行程資料產生：tags 含「✈️ 飛機」的項目）───────────────────────
    const AIRPORT_CODE = { '桃園': 'TPE', '關西': 'KIX' };
    // 使用者確認：去程、回程在兩個機場都是第一航廈（資料裡只有部分行程寫到 T1）
    const TERMINAL = 'T1';
    function flightsHtml() {
      const fl = [];
      DAYS.forEach(d => d.items.forEach(it => { if ((it.tags || []).includes('✈️ 飛機')) fl.push({ it, d }); }));
      if (!fl.length) return '';
      const hhmm = x => String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
      // "關西 T1" → 地名「關西」＋航廈「T1」；沒寫航廈就用 TERMINAL
      const point = (raw, time, right) => {
        const name = raw.replace(/\s*T\d\s*$/, ''), term = (raw.match(/T\d/) || [TERMINAL])[0];
        const key = Object.keys(AIRPORT_CODE).find(n => name.startsWith(n));
        return `<div class="fl-pt${right ? ' fl-r' : ''}"><div class="fl-code">${key ? AIRPORT_CODE[key] : ''}</div><div class="fl-time">${time}</div><div class="fl-place">${X(name)}<span class="fl-term">${X(term)}</span></div></div>`;
      };
      const card = ({ it, d }, i) => {
        const m = it.title.match(/^([A-Z0-9]{2}\d+)\s+(.+?)\s*→\s*(.+)$/);
        const t = parseTimes(it.time);
        const dir = fl.length > 1 ? (i === 0 ? '去程' : (i === fl.length - 1 ? '回程' : '轉機')) : '航班';
        let main;
        if (m && t.s != null && t.e != null) {
          const next = t.e < t.s ? '<span class="fl-next">+1</span>' : ''; // 隔天抵達
          main = `<div class="fl-main">${point(m[2], hhmm(t.s))}<div class="fl-path" aria-hidden="true"><svg class="fl-plane" viewBox="0 0 24 24"><use href="#i-plane"/></svg></div>${point(m[3], hhmm(t.e) + next, true)}</div>`;
        } else main = `<div class="fl-no-row"><span class="fl-no">${X(it.title)}</span></div>`; // 格式不符就退回顯示標題
        const info = m && FLIGHTS[m[1]];
        const who = m ? m[1] + (info && info.airline ? ' ・ ' + info.airline : '') : '';
        // 一行圖示（沒有膠囊底色）：托運｜手提｜餐點；報到截止另起一行用楓紅強調
        const facts = info ? [
          info.checked && `${ic('suitcase')}托運 ${X(info.checked)}`,
          info.carryOn && `${ic('handbag')}手提 ${X(info.carryOn)}`,
          info.meal != null && `${ic('food')}${info.meal ? '有餐點' : '無餐點'}`,
        ].filter(Boolean).map(c => `<span>${c}</span>`).join('') : '';
        const deadline = info && info.checkinDeadline ? `<div class="fl-warn">${ic('clock')}報到截止 ${X(info.checkinDeadline)}</div>` : '';
        const notes = facts || deadline ? `<div class="fl-info"><div class="fl-facts">${facts}</div>${deadline}</div>` : '';
        return `<div class="fl"><div class="fl-top"><span class="fl-dir"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plane"/></svg>${dir}</span><span class="fl-date">${X(d.date)} ${X(d.wd)}</span>${who ? `<span class="fl-who">${X(who)}</span>` : ''}</div>${main}${notes}</div>`;
      };
      return `<div class="sec-lb">航班資訊</div>${fl.map(card).join('')}`;
    }

    // ── 緊急 ─────────────────────────────────────────────────────────────────────
    // 只放確定的號碼。要補的（例如信用卡掛失、旅館電話）有號碼再加進來，沒加就不會顯示
    const EMERGENCY = [
      { label: '警察', tel: '110', note: '遇到搶劫、被偷、需要報案', jp: ['助けてください。警察を呼んでください。'] },
      { label: '救護車', tel: '119', note: '受傷、急病', jp: ['救急車を呼んでください。'] },
      // 只顯示號碼，不做成可撥打的按鈕（避免誤觸）；需要時自己撥
      { label: '台北駐大阪經濟文化辦事處（急難救助）', tel: '090-8794-4568', note: '日本境內直撥 090-8794-4568；海外或漫遊撥打 +81-90-8794-4568', jp: ['この番号に電話してください。台北駐大阪経済文化弁事処です。'] },
    ];
    function hotelSearchHref(name) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name); }
    // 「請給日本人看」：日文一句話，讓旁邊的人看了就知道要幫什麼
    const jpBlock = lines => lines && lines.length ? `<div class="jp"><div class="jp-lb">請給日本人看</div>${lines.map(l => `<div class="jp-t" lang="ja">${X(l)}</div>`).join('')}</div>` : '';
    function renderSos() {
      const td = tripDay() || 1, d = DAYS[td - 1];
      // 連續幾天住同一間旅館就合併成一列，例如「D1–D2 Tune Stay Kyoto」
      const stays = [];
      DAYS.forEach(x => { if (!isRealHotel(x.hotel)) return; const last = stays[stays.length - 1]; if (last && last.hotel === x.hotel) last.to = x.day; else stays.push({ hotel: x.hotel, from: x.day, to: x.day }); });
      const hotel = hotelOf(d);
      const home = hotel ? `<div class="nc nc-now"><div class="nc-lb">迷路了？回旅館</div><div class="nc-t">${X(hotel)}</div><a class="go-btn big" href="${X(hotelSearchHref(hotel))}" target="_blank" rel="noopener">${PIN}導航回旅館</a>${jpBlock(['道に迷いました。このホテルまで行きたいです。'])}</div>` : '';
      const tels = EMERGENCY.map(e => `<div class="nc"><div class="nc-lb">${X(e.label)}</div><div class="nc-m">${X(e.note || '')}</div><div class="sos-num">${X(e.tel)}</div>${jpBlock(e.jp)}</div>`).join('');
      const stayRows = stays.map(x => `<div class="stay"><div><div class="stay-d">${x.from === x.to ? 'D' + x.from : 'D' + x.from + '–D' + x.to}</div><div class="stay-n">${X(x.hotel)}</div></div><a class="go-btn" href="${X(hotelSearchHref(x.hotel))}" target="_blank" rel="noopener">${PIN}導航</a></div>`).join('');
      document.getElementById('sos-page').innerHTML = home + tels + `<div class="nc"><div class="nc-lb">這趟住的旅館</div>${stayRows}${jpBlock(['このホテルに泊まっています。'])}</div>`;
    }

    // ── 旅館 ─────────────────────────────────────────────────────────────────────
    // 最後一天的 hotel 欄位是「（機上）」不是旅館：不列進旅館清單；
    // 要導航時改用「最近一間真正住過的旅館」（例如 D8 退房回到 D7 的旅館）
    const isRealHotel = name => !!name && !/機上/.test(name);
    function hotelOf(day) {
      if (isRealHotel(day.hotel)) return day.hotel;
      for (let i = DAYS.indexOf(day) - 1; i >= 0; i--) if (isRealHotel(DAYS[i].hotel)) return DAYS[i].hotel;
      return '';
    }

    // ── 導航按鈕 ─────────────────────────────────────────────────────────────────
    const PIN = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pin"/></svg>';
    // 有 mapUrl 用 mapUrl；旅館沒有 mapUrl，就用當天旅館名稱搜尋 Google Maps
    function mapHref(item, day) {
      if (item.mapUrl && /^https:\/\//.test(item.mapUrl)) return item.mapUrl;
      if (item.type === 'hotel' && day && hotelOf(day)) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(hotelOf(day));
      return '';
    }
    function goBtn(item, day, cls) {
      const h = mapHref(item, day);
      return h ? `<a class="go-btn ${cls || ''}" href="${X(h)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${PIN}導航</a>` : '';
    }

    // ── HOME ─────────────────────────────────────────────────────────────────────
    function renderHome() {
      const td = tripDay();
      const eye = document.getElementById('h-eye');
      const hi = document.getElementById('h-hi');
      eye.textContent = fmtDateRange(CONFIG.tripStartDate, CONFIG.tripEndDate);
      renderCountdown();
      renderNow();
      document.getElementById('flight-wrap').innerHTML = flightsHtml();
      const todayWrap = document.getElementById('today-wrap');
      if (td) {
        const d = DAYS[td - 1];
        hi.textContent = d.highlight || '';
        todayWrap.innerHTML = `<div class="today-btn" onclick="openDay(${td})"><div><div class="tb-label">今天 · DAY ${td}</div><div class="tb-t">${X(d.date)} ${X(d.wd)}</div><div class="tb-m">${X(themeOf(d))}</div></div><div class="tb-arr">›</div></div>`;
      } else {
        const ended = jst() > new Date(CONFIG.tripEndDate + 'T23:59:59');
        hi.textContent = ended ? '旅途結束，下次見' : '';
        todayWrap.innerHTML = '';
      }
    }
    // 當天城市小標：「京都 → 大阪」；沒寫就退回資料裡的 cities
    function cityPill(d) {
      const nodes = (CITYROUTE[d.day] && CITYROUTE[d.day].length ? CITYROUTE[d.day] : d.cities) || [];
      return nodes.length ? `<span class="city-pill">${ic('pin')}${nodes.map(X).join('<span class="arr">→</span>')}</span>` : '';
    }
    const themeOf = d => THEMES[d.day] || d.highlight || d.cities.join(' → '); // 沒寫主題就退回原本的城市
    function renderTrip() {
      const td = tripDay();
      // 一天一張大卡片；旅行中「今天」那張整張換成楓紅色
      document.getElementById('days-grid').innerHTML = DAYS.map(d => `<button type="button" class="dc${td === d.day ? ' today' : ''}" onclick="openDay(${d.day})"><svg class="dc-leaf" viewBox="0 0 100 100" aria-hidden="true"><use href="#leaf"/></svg><span class="dc-num"><small>DAY</small><b>${d.day}</b></span><span class="dc-body"><span class="dc-d">${X(d.date)} ${X(d.wd)}${td === d.day ? '<em class="dc-now">今天</em>' : ''}</span><span class="dc-theme">${X(themeOf(d))}</span>${cityPill(d)}</span></button>`).join('');
    }

    // ── SEARCH ────────────────────────────────────────────────────────────────────
    function itemHaystack(item) {
      const textOf = v => typeof v === 'string' ? v : (v && (v.name || v.text)) || '';
      return [
        item.title, item.area, item.trs, item.hotel,
        typeof item.desc === 'string' ? item.desc : (Array.isArray(item.desc) ? item.desc.map(textOf).join(' ') : ''),
        Array.isArray(item.tasks) ? item.tasks.join(' ') : '',
        Array.isArray(item.mustEat) ? item.mustEat.map(textOf).join(' ') : '',
      ].filter(Boolean).join(' ').toLowerCase();
    }
    function searchItems(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const results = [];
      DAYS.forEach(d => {
        d.items.forEach(item => {
          if (itemHaystack(item).includes(q)) results.push({ day: d.day, date: d.date, wd: d.wd, item });
        });
      });
      return results;
    }
    function onSearchInput() {
      const q = document.getElementById('search-inp').value;
      const el = document.getElementById('search-results');
      if (!q.trim()) { el.classList.remove('active'); el.innerHTML = ''; return; }
      const results = searchItems(q);
      el.classList.add('active');
      el.innerHTML = results.length
        ? results.map(r => `<div class="sr-item" onclick="goSearchResult(${r.day},'${r.item.id}')"><div class="sr-day">DAY ${r.day} · ${r.date} ${r.wd}</div><div class="sr-title">${typeIcon(r.item)} ${X(noEmoji(SHORT[r.item.id] || r.item.title))}</div></div>`).join('')
        : '<div class="w-msg">沒有符合的行程項目</div>';
    }
    function goSearchResult(day, itemId) {
      document.getElementById('search-inp').value = '';
      document.getElementById('search-results').classList.remove('active');
      document.getElementById('search-results').innerHTML = '';
      openDay(day);
      togCard(itemId); // 只展開搜尋到的那一項
      const el = document.getElementById('ic-' + itemId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ── DAY ───────────────────────────────────────────────────────────────────────
    // 交通工具 → 固定色票（顏色定義在 style.css 的 .tag-*）
    const TAG_CLASS = {
      '步行': 'walk', 'JR': 'jr', '地鐵': 'metro', '巴士': 'bus', '京阪': 'keihan', '阪急': 'hankyu',
      '近鐵': 'kintetsu', '南海': 'nankai', 'HARUKA': 'haruka', '✈️ 飛機': 'plane', '計程車': 'taxi',
      '纜車': 'cable', '嵯峨野小火車': 'sagano', '開車': 'car',
    };
    // status → 徽章文字；none 不顯示
    const STATUS_BADGE = { booked: ['check', '已預約'], todo: ['clock', '待預約'], buyOnSite: ['ticket', '現場購票'], queue: ['users', '現場排隊'], unconfirmed: ['help', '待確認'] };
    function chipsHtml(item) {
      const tags = (item.tags || []).map(t => `<span class="tag tag-${TAG_CLASS[t] || 'other'}">${X(noEmoji(t))}</span>`).join('');
      const sb = STATUS_BADGE[item.status];
      const st = sb ? `<span class="st st-${item.status}">${ic(sb[0])}${sb[1]}</span>` : '';
      return tags || st ? `<div class="chip-row">${tags}${st}</div>` : '';
    }
    // 備註含這些字的整行視為「重點」，集中放進淺楓紅的框（關鍵字是我們自己猜的，不是資料標好的）
    const ALERT_RE = /取消|⚠|一定|務必|最晚|截止|未到|不能|禁/;
    function notesHtml(t, hide) {
      // 先用原文判斷是不是重點（原文的 ⚠ 也算），再去掉編號與 emoji
      const ls = String(t).split('\n').map(x => x.replace(/^\d+\.\s*/, '').trim()).filter(x => x && !(hide || []).includes(x))
        .map(x => ({ alert: ALERT_RE.test(x), text: maskNote(noEmoji(x)) })).filter(x => x.text);
      const al = ls.filter(x => x.alert), rest = ls.filter(x => !x.alert);
      return (al.length ? `<div class="alert-box"><div class="alert-lb">${ic('sos')}重點</div>${al.map(x => `<div>${lineHtml(X(x.text))}</div>`).join('')}</div>` : '')
        + (rest.length ? `<ul class="notes">${rest.map(x => `<li>${lineHtml(X(x.text))}</li>`).join('')}</ul>` : '');
    }
    // 「交通」列：句子原樣顯示（不拆解，免得拆錯）；「→」用楓紅，時間（約 N 分）加粗
    function accessHtml(l) {
      return X(l).split('→').map(x => x.trim().replace(/(約?\s*\d+(?:[–-]\d+)?\s*分鐘?)/g, '<b>$1</b>')).join(' <span class="ar">→</span> ');
    }
    // 待辦：資料裡的 item.tasks（字串陣列）。每一項有 checkbox，勾選狀態存在手機（localStorage）。
    // 記錄代號用「行程 id＋第幾項」，所以改文字不會讓勾選狀態對錯項目；但調整項目「順序」會
    const taskId = (item, i) => `${item.id}#${i + 1}`;
    function todoCount(item, tasks) { const n = (item.tasks || []).length; return { n, done: (item.tasks || []).filter((_, i) => tasks[taskId(item, i)]).length }; }
    function todoHtml(item, tasks) {
      if (!item.tasks || !item.tasks.length) return '';
      const rows = item.tasks.map((t, i) => {
        const tid = taskId(item, i);
        return `<div class="tr${tasks[tid] ? ' done' : ''}" role="checkbox" tabindex="0" aria-checked="${!!tasks[tid]}" onclick="togTask('${X(tid)}','${X(item.id)}',this)" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();togTask('${X(tid)}','${X(item.id)}',this)}"><div class="tcb"></div><div class="t-text">${X(noEmoji(t))}</div></div>`;
      }).join('');
      return `<div class="todo"><div class="todo-lb">${ic('check')}待辦（做完請打勾）</div>${rows}</div>`;
    }
    // 收合列上的「待辦 1/2」小標：沒做完是楓紅色，全做完變灰
    function todoChip(item, tasks) {
      const c = todoCount(item, tasks);
      return c.n ? `<span class="tl-todo${c.done === c.n ? ' all' : ''}" id="td-${X(item.id)}">${ic('check')}${c.done}/${c.n}</span>` : '';
    }
    function renderDay() {
      const d = DAYS[curDay - 1];
      // 當天節奏：第一項與最後一項的開始時間（不顯示行程數，免得看了就覺得累）
      const startOf = it => String(it.time || '').split(/[–-]/)[0];
      const stay = isRealHotel(d.hotel) ? `${ic('bed')}<span>${X(d.hotel)}</span>` : `${ic('plane')}<span>夜間班機，今晚在機上</span>`; // D8 的 hotel 欄位是「（機上）」
      document.getElementById('day-hdr').innerHTML = `<svg class="dh-leaf" viewBox="0 0 100 100" aria-hidden="true"><use href="#leaf"/></svg>`
        + `<div class="dh-main"><div class="dh-num"><small>DAY</small><b>${d.day}</b></div><div class="dh-body"><div class="dh-date">${X(d.date)} ${X(d.wd)}</div><div class="dh-t">${X(themeOf(d))}</div>${cityPill(d)}</div></div>`
        + `<div class="dh-stats"><div><i>出發</i><b>${X(startOf(d.items[0]))}</b></div><div><i>收工</i><b>${X(startOf(d.items.at(-1)))}</b></div></div>`
        + `<div class="dh-h">${stay}</div>`;
      const tasks = getTasks();
      const trsHtml = s => {
        const dur = t => t.replace(/\[(\d+(?:-\d+)?(?:min|hr))\]/g, '<span class="trs-dur">$1</span>');
        const nl = s.indexOf('\n');
        if (nl === -1) return dur(X(s));
        return `${dur(X(s.slice(0, nl)))}<br><span class="trs-route">${dur(X(s.slice(nl + 1)))}</span>`;
      };
      const miHtml = m => { if (typeof m === 'string') return `<div class="mi"><span class="mi-name">${X(m)}</span></div>`; const hb = m.hours ? `<span class="mi-hours">${X(m.hours)}</span>` : ''; const mb = m.mapUrl ? `<a class="mi-map" href="${X(m.mapUrl)}" target="_blank" rel="noopener">導航</a>` : ''; const nm = m.name || m.text || ''; return `<div class="mi"><span class="mi-name">${X(nm)}</span>${hb}${mb}</div>`; };
      const startLabel = d.day === 1 ? '從家出發' : '從飯店出發';
      const rows = d.items.map((item, idx) => {
        // 第一項是旅館的事（例如 D8 退房、寄放行李）：不另外列一行，直接當作「從飯店出發」，退房內容放在展開裡
        const asStart = idx === 0 && item.type === 'hotel';
        const isOpen = expanded.has(item.id), mh = mapHref(item, d);
        // 展開後的內容：地點／標籤 → 備註 → 其他區塊 → 導航
        let body = todoHtml(item, tasks); // 待辦（有 checkbox）放在最前面，才不會漏掉
        if (item.trs && item.trs.length > 40) body += `<div class="blk"><div class="blk-lb">交通</div><div class="blk-vl">${trsHtml(item.trs)}</div></div>`;
        if (item.desc) body += typeof item.desc === 'string' ? notesHtml(item.desc, ACCESS[item.id])
          : `<div class="blk"><div class="must-list">${item.desc.map(miHtml).join('')}</div></div>`;
        if (item.memo) {
          const memo = Array.isArray(item.memo) ? item.memo.map(m => {
            if (typeof m === 'string') return `<div class="memo-item"><div class="memo-item-text">${X(m)}</div></div>`;
            const mapBtn = m.mapUrl ? `<a class="mi-map" href="${X(m.mapUrl)}" target="_blank" rel="noopener">導航</a>` : '';
            const detail = m.text || m.desc || '';
            return `<div class="memo-item"><div class="memo-item-head"><span class="memo-item-name">${X(m.name || m.title || '')}</span>${mapBtn}</div>${detail ? `<div class="memo-item-text">${X(detail)}</div>` : ''}</div>`;
          }).join('') : X(item.memo);
          body += `<div class="blk"><div class="blk-lb">備選</div><div class="blk-vl">${memo}</div></div>`;
        }
        if (item.mustEat && item.mustEat.length) body += `<div class="blk"><div class="blk-lb">必吃推薦</div><div class="must-list">${item.mustEat.map(miHtml).join('')}</div></div>`;
        if (item.reservation) { const r = item.reservation; const tcHref = r.tcUrl || 'https://www.tablecheck.com/zh-TW/account/reservations/upcoming'; body += `<div class="blk"><div class="blk-lb">訂位資訊</div><div class="rg"><div class="rc"><div class="rc-lb">ID</div><div class="rc-vl">${X(r.id)}</div></div>${r.time ? `<div class="rc"><div class="rc-lb">時間</div><div class="rc-vl">${X(r.time)}</div></div>` : ''}${r.menu ? `<div class="rc" style="grid-column:1/-1"><div class="rc-lb">內容</div><div class="rc-vl">${X(r.menu)}</div></div>` : ''}</div><a class="tc-btn" href="${X(tcHref)}" target="_blank" rel="noopener">TableCheck 查看訂位</a></div>`; }
        if (mh) body += `<a class="map-btn" href="${X(mh)}" target="_blank" rel="noopener">${PIN}Google Maps 導航</a>`;
        // 資訊列：資料裡本來就有獨立欄位的，整理成一眼能讀的表格（時間已在左邊，不重複）
        const PAY = { paid: '已付款', onSite: '現場付款' };
        const cost = item.cost ? `¥${item.cost.toLocaleString('en-US')}（2 人${PAY[item.payment] ? '・' + PAY[item.payment] : ''}）` : (PAY[item.payment] || '');
        const row = (label, html) => `<div class="kv"><span>${label}</span><b>${html}</b></div>`;
        const plain = (label, v) => v ? row(label, X(v)) : '';
        // 交通類行程：完整名稱其實就是路線，放進「交通」列；標題只留簡短一句，所以不再重複顯示完整名稱
        const isTransport = item.type === 'transport';
        const routeRow = isTransport && SHORT[item.id] && SHORT[item.id] !== item.title ? row('交通', accessHtml(noEmoji(item.title))) : '';
        const kv = plain('地點', noEmoji(item.area))
          + plain('營業', noEmoji(item.hours).replace(/L\.\s?O\.?/g, '最後點餐'))
          + routeRow
          + (ACCESS[item.id] || []).map(l => row('交通', accessHtml(l))).join('') // 營業下面：怎麼去
          + plain('費用', cost) + (item.booking ? row('預約', lineHtml(X(maskNote(noEmoji(item.booking))))) : '');
        const full = asStart ? `<div class="d-full">${X(noEmoji(item.title))}</div>` : !isTransport && SHORT[item.id] && SHORT[item.id] !== item.title ? `<div class="d-full">${X(noEmoji(item.title))}</div>` : '';
        // 有 tags 就用標籤，不再重複顯示 trs 文字；沒有 tags 才退回顯示 trs
        const shortTrs = !item.tags && item.trs && item.trs.length <= 40 ? `<div class="tl-meta">${trsHtml(item.trs)}</div>` : '';
        const [t1, t2] = String(item.time || '').split(/[–-]/);
        const small = item.type === 'transport' || item.type === 'hotel';
        return `<div class="tl-row ${small ? 'sm' : 'key'}${asStart ? ' mark' : ''}${item.optional ? ' optional' : ''}${isOpen ? ' open' : ''}${isTransport ? (modeOf(item) === 'walk' ? ' walk' : ' ride') : ''}" id="ic-${X(item.id)}" data-type="${X(item.type || '')}"><div class="tl-t">${X(t1 || '')}${t2 ? `<small>${X(t2)}</small>` : ''}</div><div class="tl-dot" aria-hidden="true"></div><div class="tl-main"><button type="button" class="tl-head" aria-expanded="${isOpen}" aria-controls="ib-${X(item.id)}" onclick="togCard('${X(item.id)}')"><span class="tl-ic">${asStart ? ic('flag') : typeIcon(item)}</span><span class="tl-title">${X(asStart ? startLabel : noEmoji(SHORT[item.id] || item.title))}</span>${asStart ? '' : tagChips(item, noEmoji(SHORT[item.id] || item.title))}${todoChip(item, tasks)}${item.optional ? '<span class="opt-chip">選配</span>' : ''}<span class="tl-chev" aria-hidden="true">›</span></button></div><div class="tl-detail${isOpen ? '' : ' hidden'}" id="ib-${X(item.id)}">${full}${chipsHtml(item)}${kv ? `<div class="kvs">${kv}</div>` : ''}${shortTrs}${body}</div></div>`;
      });
      // 每天的頭尾加一列「標記」：開頭「從飯店出發」，結尾「回飯店」（最後一天是「回家」）。這是畫面上加的，不是資料
      const endOf = it => String(it.time || '').split(/[–-]/).pop(); // startOf 在上面標題小卡那段已經定義過
      const markRow = (time, icon, text) => `<div class="tl-row mark"><div class="tl-t">${X(time)}</div><div class="tl-dot" aria-hidden="true"></div><div class="tl-main"><div class="tl-head"><span class="tl-ic">${ic(icon)}</span><span class="tl-title">${X(text)}</span></div></div></div>`;
      if (d.items[0].type !== 'hotel') rows.unshift(markRow(startOf(d.items[0]), 'flag', startLabel)); // 第一項是旅館的事就已經當作出發列了（見上面 asStart）
      const last = d.items.at(-1);
      if (d.day === DAYS.length) rows.push(markRow(endOf(last), 'home', '回家'));
      else if (last.type !== 'hotel') rows.push(markRow(endOf(last), 'bed', '回飯店')); // 最後一項本來就是回飯店就不重複
      document.getElementById('items-wrap').innerHTML = rows.join('');
    }
    function togCard(id) {
      const row = document.getElementById('ic-' + id), box = document.getElementById('ib-' + id);
      if (!row || !box) return;
      const open = row.classList.toggle('open');
      box.classList.toggle('hidden', !open);
      row.querySelector('.tl-head').setAttribute('aria-expanded', String(open));
      if (open) expanded.add(id); else expanded.delete(id);
    }
    function togTask(tid, itemId, el) {
      const t = getTasks(), nv = !t[tid]; setTask(tid, nv);
      el.classList.toggle('done', nv); el.setAttribute('aria-checked', String(nv));
      const chip = document.getElementById('td-' + itemId);
      if (chip) { // 同步更新收合列的進度小標
        const item = DAYS.flatMap(d => d.items).find(x => x.id === itemId), c = todoCount(item, getTasks());
        chip.lastChild.textContent = `${c.done}/${c.n}`; chip.classList.toggle('all', c.done === c.n);
      }
    }

    // ── CHECKLIST ─────────────────────────────────────────────────────────────────
    function renderChk() {
      const tasks = getTasks(); let html = '';
      Object.entries(GTASKS).forEach(([cat, items]) => {
        html += `<div class="chk-sec"><div class="chk-sec-t">${X(noEmoji(cat))}</div>`;
        items.forEach(item => { const dn = tasks[item.id] ? 'done' : ''; const dateBadge = item.date ? `<div class="cr-date">${item.date}</div>` : ''; const am = item.text.match(/^\[([^\]]+)\]\s*/); const area = am ? am[1] : ''; const txt = am ? item.text.slice(am[0].length) : item.text; const areaBadge = area ? `<div class="cr-area">${X(area)}</div>` : ''; html += `<div class="cr ${dn}" onclick="togChk('${item.id}',this)"><div class="ccb"></div><div class="cr-body">${dateBadge}${areaBadge}<div class="cr-text">${X(noEmoji(txt))}</div></div></div>`; });
        html += '</div>';
      });
      const shop = getShop();
      html += `<div class="chk-sec"><div class="chk-sec-t">購物清單</div>`;
      shop.forEach((item, i) => { html += `<div class="cr ${item.done ? 'done' : ''}" onclick="togShop(${i},this)"><div class="ccb"></div><div class="cr-text">${X(item.text)}</div></div>`; });
      html += `<div class="add-row"><input class="add-inp" id="si" placeholder="新增購物項目..." onkeydown="if(event.key==='Enter')addShop()"><div class="add-btn" onclick="addShop()">＋</div></div></div>`;
      document.getElementById('chk-page').innerHTML = html;
    }
    function togChk(id, el) { const t = getTasks(), nv = !t[id]; setTask(id, nv); el.classList.toggle('done', nv); }
    function togShop(i, el) { const l = getShop(); l[i].done = !l[i].done; saveShop(l); el.classList.toggle('done', l[i].done); }
    function addShop() { const inp = document.getElementById('si'), txt = (inp.value || '').trim(); if (!txt) return; const l = getShop(); l.push({ id: 'u' + Date.now(), text: txt, done: false }); saveShop(l); inp.value = ''; renderChk(); }

    // ── FX ────────────────────────────────────────────────────────────────────────
    const CURRENCY_SYMBOLS = { TWD: 'NT$', JPY: '¥' };
    // 快速換算的日幣面額
    const QUICK_AMOUNTS = { JPY: [500, 1000, 3000, 5000, 10000, 30000] };
    let liveRate = null;

    function fxLabel(code) { return `${code} ${CURRENCY_SYMBOLS[code] || ''}`.trim(); }
    async function fetchRate() {
      const rateEl = document.getElementById('fx-rate');
      const { from, to, referenceRate } = CONFIG.currency;
      if (rateEl) rateEl.textContent = '匯率抓取中...';
      try {
        const r = await fetch(`https://open.er-api.com/v6/latest/${from}`);
        const data = await r.json();
        const rate = data.rates && data.rates[to];
        if (rate && rate > 0) {
          liveRate = rate;
          let asOf = '';
          if (data.time_last_update_unix) {
            const d = new Date(data.time_last_update_unix * 1000);
            asOf = `${d.getUTCFullYear()}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}`;
          }
          if (rateEl) rateEl.innerHTML = `1 ${from} = ${rate.toFixed(4)} ${to}${asOf ? `<br>（${asOf} 即時匯率）` : ''}`;
          renderQFx();
        } else {
          throw new Error('no rate');
        }
      } catch (e) {
        if (referenceRate) {
          liveRate = referenceRate;
          if (rateEl) rateEl.textContent = `1 ${from} ≈ ${referenceRate} ${to}（參考匯率，無法取得即時）`;
        } else if (rateEl) {
          rateEl.textContent = '無法取得即時匯率，請確認網路連線';
        }
        renderQFx();
      }
    }
    function calcFx(f) {
      const j = document.getElementById('fx-j'), t = document.getElementById('fx-t');
      if (!liveRate) return;
      if (f === 'j') { const v = parseFloat(j.value) || 0; t.value = v ? Math.round(v * liveRate) : ''; }
      else { const v = parseFloat(t.value) || 0; j.value = v ? Math.round(v / liveRate) : ''; }
    }
    function renderQFx() {
      const el = document.getElementById('qg');
      if (!liveRate) { el.innerHTML = '<div class="w-msg" style="grid-column:1/-1">尚無匯率資料</div>'; return; }
      const { from, to } = CONFIG.currency;
      const symFrom = CURRENCY_SYMBOLS[from] || from, symTo = CURRENCY_SYMBOLS[to] || to;
      const amounts = QUICK_AMOUNTS[from] || [500, 1000, 3000, 5000, 10000, 30000];
      el.innerHTML = amounts.map(a => `<div class="qc" onclick="setFx(${a})"><div class="qc-j">${symFrom}${a.toLocaleString()}</div><div class="qc-t">${symTo} ${Math.round(a * liveRate).toLocaleString()}</div></div>`).join('');
    }
    function setFx(j) { if (!liveRate) return; document.getElementById('fx-j').value = j; document.getElementById('fx-t').value = Math.round(j * liveRate); }

    // ── WEATHER ───────────────────────────────────────────────────────────────────
    // 天氣代碼 → 線條圖示（0 晴、1–3 多雲、45/48 霧、5x–6x 與 8x 雨、7x 雪、9x 雷雨）
    function wxIcon(code) {
      if (code === 0 || code === 1) return 'sun';
      if (code <= 3) return 'cloud';
      if (code === 45 || code === 48) return 'fog';
      if (code >= 95) return 'bolt';
      if (code >= 71 && code <= 77) return 'snow';
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
      return 'cloud';
    }
    const WMO_DESC = { 0: '晴天', 1: '大致晴', 2: '多雲', 3: '陰天', 45: '霧', 51: '小雨', 61: '下雨', 71: '下雪', 80: '陣雨', 95: '雷雨' };
    const wxCache = {};
    function selCity(c) {
      document.querySelectorAll('.wct').forEach(t => t.classList.toggle('active', t.textContent === CITIES[c].label));
      loadWx(c);
    }
    async function loadWx(city) {
      const el = document.getElementById('w-disp'); if (!el) return;
      if (wxCache[city]) { renderWx(wxCache[city], CITIES[city].days); return; }
      el.innerHTML = '<div class="w-msg dl"><span>.</span><span>.</span><span>.</span></div>';
      try {
        const { lat, lon } = CITIES[city];
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia/Tokyo&start_date=${CONFIG.tripStartDate}&end_date=${CONFIG.tripEndDate}`);
        const data = await r.json();
        if (data.error) { el.innerHTML = '<div class="w-msg">天氣預報還查不到這幾天<br>通常出發前7天內才查得到，請晚點再回來看</div>'; return; }
        wxCache[city] = data; renderWx(data, CITIES[city].days);
      } catch (e) { el.innerHTML = '<div class="w-msg">天氣資料載入失敗<br>請確認網路連線</div>'; }
    }
    function wxLabel(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const wd = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][d.getDay()];
      return `${d.getMonth() + 1}/${d.getDate()} ${wd}`;
    }
    function renderWx(data, days) {
      const el = document.getElementById('w-disp'); if (!el) return;
      const { daily } = data;
      let html = '<div class="w-grid">';
      daily.time.forEach((dateStr, i) => {
        if (!days.includes(dateStr)) return;
        const code = daily.weathercode[i], icon = ic(wxIcon(code));
        const desc = WMO_DESC[code] || WMO_DESC[Math.floor(code / 10) * 10] || '—';
        const max = Math.round(daily.temperature_2m_max[i]), min = Math.round(daily.temperature_2m_min[i]);
        const rainVal = daily.precipitation_probability_max ? (daily.precipitation_probability_max[i] ?? null) : null;
        const hi = rainVal !== null && rainVal >= 50;
        const rainHtml = rainVal !== null ? `<div class="wc-rain"><div class="wc-rain-pct${hi ? ' hi' : ''}">${rainVal}%</div><div class="wc-rain-label">降雨</div></div>` : `<div class="wc-rain"><div class="wc-rain-label">— 降雨</div></div>`;
        html += `<div class="wc"><div class="wc-day">${wxLabel(dateStr)}</div><div class="wc-icon">${icon}</div><div class="wc-temp">${max}° / ${min}°</div><div class="wc-desc">${desc}</div><div class="wc-divider"></div>${rainHtml}</div>`;
      });
      el.innerHTML = html + '</div>';
    }

    // ── UTIL ─────────────────────────────────────────────────────────────────────
    // 線條圖示（symbol 定義在檔案最上面的隱藏 <svg>）
    function ic(name, cls) { return `<svg class="ico${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`; }
    // 畫面上不顯示 emoji：資料裡零星有 📸 🛍 等，統一拿掉，只留文字（不改資料檔）
    function noEmoji(s) { return String(s == null ? '' : s).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '').replace(/[ \t]{2,}/g, ' ').trim(); }
    // 資料裡的預約編號都遮成「●●●」（真編號存在 LINE 記事本，不放進公開網站）。畫面上改顯示成「LINE 記事本」小標籤
    function maskNote(s) { return String(s == null ? '' : s).replace(/●+/g, '【LINE 記事本】'); }
    function lineHtml(escapedHtml) { return escapedHtml.replace(/【LINE 記事本】/g, '<span class="ln">LINE 記事本</span>'); }
    // 行程類型 → 圖示（飛機另外判斷）
    const TYPE_ICON = { transport: 'train', food: 'food', sight: 'camera', hotel: 'bed', shopping: 'bag', activity: 'star' };
    // 景點再細分：看資料裡每個行程的 icon 欄位（emoji）。沒有對到的景點一律用相機（通用的「景點」圖示）
    const EMOJI_ICON = { '⛩': 'torii', '🎢': 'park', '⛵': 'boat', '🗼': 'tower', '✨': 'sparkle', '📍': 'camera', '👘': 'kimono', '🛍': 'bag', '🍁': 'maple', '🛂': 'passport' };
    // 交通方式 → 圖示：飛機／汽車（計程車、開車）／走路（只有步行）／電車（其餘）；非交通類看行程類型
    function modeOf(item) {
      const t = item.tags || [];
      if (t.includes('✈️ 飛機')) return 'plane';
      const byEmoji = EMOJI_ICON[(item.icon || '').replace(/\uFE0F/g, '')];
      if (byEmoji && item.type !== 'sight' && item.type !== 'activity' && item.type !== 'shopping') return byEmoji; // 交通等類型：icon 在對照表裡就優先（例如入境 🛂）
      if (item.type === 'transport') {
        if (t.length && t.every(x => x === '步行')) return 'walk';
        if (t.some(x => x === '計程車' || x === '開車')) return 'car';
      }
      if (item.type === 'food') return /^(點心|咖啡)/.test(SHORT[item.id] || '') ? 'cup' : 'food'; // 點心、咖啡用杯子，正餐用刀叉
      if (item.type === 'sight' || item.type === 'activity' || item.type === 'shopping') {
        return EMOJI_ICON[(item.icon || '').replace(/\uFE0F/g, '')] || TYPE_ICON[item.type];
      }
      return TYPE_ICON[item.type] || 'camera';
    }
    function typeIcon(item) { return ic(modeOf(item)); }
    // 收合列右邊的交通小標籤：搭車＝淡楓紅、步行＝淡灰；標題裡已經寫了的不重複；最多 2 個（3 個以上只顯示 1 個），其餘「+N」
    function tagChips(item, title) {
      if (item.type !== 'transport') return '';
      const tags = (item.tags || []).map(noEmoji).filter(t => t && !title.includes(t));
      if (!tags.length) return '';
      const chip = t => `<span class="tl-tg ${t === '步行' ? 'w' : 'r'}">${X(t)}</span>`;
      const max = tags.length > 2 ? 1 : 2; // 3 個以上只顯示第一個，其餘「+N」，免得擠到標題換行
      return `<span class="tl-tgs">${tags.slice(0, max).map(chip).join('')}${tags.length > max ? `<span class="tl-tg w">+${tags.length - max}</span>` : ''}</span>`;
    }
    function X(s) { if (!s) return ''; return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function fmtDateRange(startISO, endISO) {
      const [sy, sm, sd] = startISO.split('-'), [, em, ed] = endISO.split('-');
      return `${sy}.${sm}.${sd} – ${em}.${ed}`;
    }

    // ── INIT ─────────────────────────────────────────────────────────────────────
    function showLoadError(e) {
      console.error('讀取行程資料失敗：', e);
      const msg = location.protocol === 'file:'
        ? '行程資料讀取失敗<br><br>不能直接雙擊打開 index.html，瀏覽器會擋掉本地檔案的讀取。<br>請改用本地伺服器打開（例如 VS Code 的 Live Server 外掛），或部署到網路上後再瀏覽。'
        : '行程資料讀取失敗<br><br>請確認 data/ 資料夾裡的 JSON 檔案格式是否正確（可用 jsonlint.com 檢查有沒有多逗號或漏引號），修正後重新整理頁面。';
      const eye = document.getElementById('h-eye');
      if (eye) eye.textContent = '';
      const grid = document.getElementById('days-grid');
      if (grid) grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:24px 16px;color:var(--maple);line-height:1.8">${msg}</div>`;
    }
    document.addEventListener("DOMContentLoaded", async function () {
      tick(); setInterval(tick, 15000);
      try {
        await loadData();
        applyDisplay();
        goPg('home');
      } catch (e) {
        showLoadError(e);
      }
    });
  </script>
</body>

</html>
